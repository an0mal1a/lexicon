[package]
name = "lexicon-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
lexicon-core = { path = "../lexicon-core" }
lexicon-game = { path = "../lexicon-game" }
lxdb = { version = "0.1.0", path = "../../lexinexo/crates/lxdb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net"] }
